name: Deploy website to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy. Set to a previous tag or SHA to roll back."
        required: false
        default: "main"

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel in-progress deployments; queue the latest one instead.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @sprintfoundry/website build

      - run: pnpm --filter @sprintfoundry/website test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed site
        run: |
          curl -fsS --retry 5 --retry-delay 5 "${{ steps.deployment.outputs.page_url }}" | grep -q "SprintFoundry"
          {
            echo "### Website deployment"
            echo "- Ref: \`${{ inputs.ref || github.sha }}\`"
            echo "- URL: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
