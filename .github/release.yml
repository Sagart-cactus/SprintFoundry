changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: Breaking changes
      labels: ["breaking-change"]
    - title: Features
      labels: ["enhancement", "feature"]
    - title: Bug fixes
      labels: ["bug"]
    - title: Security
      labels: ["security"]
    - title: Documentation
      labels: ["documentation"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
