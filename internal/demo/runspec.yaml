version: 1
build:
  dockerfile: Dockerfile
  network: none
  base_images:
    - docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
preview:
  port: 8080
  health: { path: /healthz, status: 200 }
actors:
  owner:   { headers: { Cookie: session=owner-session } }
  member:  { headers: { Cookie: session=member-session } }
  visitor: { headers: {} }
sensitive_paths:
  - Dockerfile
  - "test_*.py"
  - "*_test.py"
  - ".github/workflows/*"
  - "requirements*.txt"
  - pyproject.toml
